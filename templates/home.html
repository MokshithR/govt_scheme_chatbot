<!DOCTYPE html>
<html lang="en">
<head>
  <title>YOJANA MITHRA - Your Government Scheme Assistant | AI-Powered Chatbot</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YOJANA MITHRA - Your smart AI assistant for all Indian Government Schemes. Get instant information on agriculture, education, health, and welfare schemes in English, Kannada, and Hindi.">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Government of India Color Palette */
      --primary-orange: #FF9933;
      --primary-white: #FFFFFF;
      --primary-green: #138808;
      --navy-blue: #000080;
      --dark-blue: #1e3a8a;
      --light-blue: #3b82f6;
      --success-green: #10b981;
      --warning-orange: #f59e0b;
      --error-red: #ef4444;
      
      /* Modern UI Colors */
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-accent: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #e0f2fe 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header Section */
    .header {
      background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-green) 100%);
      color: white;
      padding: 2rem 0;
      text-align: center;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      opacity: 0.3;
    }

    .header-content {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Authentication Styles */
    .auth-container {
      position: absolute;
      top: 1rem;
      right: 2rem;
      z-index: 10;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .auth-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .auth-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .auth-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .user-menu {
      position: relative;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-green));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .user-avatar:hover {
      transform: scale(1.05);
    }

    .user-dropdown {
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      min-width: 200px;
      display: none;
      z-index: 1000;
    }

    .user-dropdown.active {
      display: block;
    }

    .dropdown-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background 0.2s ease;
      color: var(--text-primary);
      text-decoration: none;
      display: block;
    }

    .dropdown-item:hover {
      background: var(--bg-accent);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--error-red);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .close-modal:hover {
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.1);
    }

    .form-select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 1rem;
      background: white;
      cursor: pointer;
    }

    .form-checkbox {
      margin-right: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-green));
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-accent);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn-secondary:hover {
      background: var(--border-light);
    }

    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error-red);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .auth-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success-green);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .profile-section {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 1rem 0;
      box-shadow: var(--shadow-md);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-green));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .profile-info h3 {
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    .profile-info p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .stat-card {
      background: var(--bg-accent);
      padding: 1rem;
      border-radius: var(--radius-md);
      text-align: center;
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary-orange);
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .header h1 {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 400;
      opacity: 0.95;
      margin-bottom: 1rem;
    }

    .header-subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Chat Interface */
    .chat-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .chat-header {
      background: linear-gradient(135deg, var(--dark-blue) 0%, var(--light-blue) 100%);
      color: white;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h3 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Chat Messages Area */
    #log {
      height: 500px;
      overflow-y: auto;
      padding: 1.5rem;
      background: var(--bg-accent);
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }

    #log::-webkit-scrollbar {
      width: 6px;
    }

    #log::-webkit-scrollbar-track {
      background: var(--border-light);
      border-radius: 3px;
    }

    #log::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 3px;
    }

    #log::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Message Styling */
    #log p {
      margin: 0.75rem 0;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-lg);
      line-height: 1.5;
      animation: fadeInUp 0.3s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .you {
      background: linear-gradient(135deg, var(--light-blue) 0%, var(--dark-blue) 100%);
      color: white;
      margin-left: 2rem;
      border-bottom-right-radius: 0.25rem;
      box-shadow: var(--shadow-md);
    }

    .bot {
      background: var(--bg-secondary);
      color: var(--text-primary);
      margin-right: 2rem;
      border: 1px solid var(--border-light);
      border-bottom-left-radius: 0.25rem;
      box-shadow: var(--shadow-sm);
    }

    /* Scheme Cards */
    .schemes-container {
      margin: 1rem 0;
      padding: 1.5rem;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--primary-green);
      box-shadow: var(--shadow-md);
    }

    .schemes-container h3 {
      color: var(--primary-green);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .scheme-card {
      background: white;
      margin: 1rem 0;
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border-left: 4px solid var(--primary-orange);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .scheme-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary-orange) 0%, var(--primary-green) 100%);
    }

    .scheme-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .scheme-card h4 {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .scheme-card p {
      margin: 0.5rem 0;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .scheme-card strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .scheme-card a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--light-blue);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      background: #eff6ff;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    .scheme-card a:hover {
      background: var(--light-blue);
      color: white;
      transform: translateX(2px);
    }

    /* Apply Button Styles */
    .scheme-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-light);
    }

    .apply-btn {
      background: linear-gradient(135deg, var(--primary-orange) 0%, var(--warning-orange) 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }

    .apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      background: linear-gradient(135deg, var(--warning-orange) 0%, var(--primary-orange) 100%);
    }

    .apply-btn:active {
      transform: translateY(0);
    }

    .info-btn {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border-medium);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .info-btn:hover {
      background: var(--bg-accent);
      border-color: var(--light-blue);
      color: var(--light-blue);
      transform: translateY(-1px);
    }

    /* Application Info Styles */
    .application-info, .scheme-details {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 1rem 0;
      box-shadow: var(--shadow-sm);
    }

    .application-info h4, .scheme-details h4 {
      color: var(--primary-orange);
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .application-info h5 {
      color: var(--text-primary);
      margin: 1rem 0 0.5rem 0;
      font-size: 1rem;
    }

    .application-steps ol {
      margin: 0.5rem 0 1rem 1.5rem;
      padding: 0;
    }

    .application-steps li {
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .helpline-info, .contact-info {
      background: var(--bg-accent);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-top: 1rem;
    }

    /* Enhanced Application Guidance Styles */
    .application-guidance {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin: 1rem 0;
      box-shadow: var(--shadow-sm);
    }

    .application-guidance h4 {
      color: var(--primary-orange);
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .application-guidance h5 {
      color: var(--text-primary);
      margin: 1rem 0 0.5rem 0;
      font-size: 1rem;
    }

    .document-checklist {
      background: var(--bg-accent);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin: 1rem 0;
    }

    .document-checklist ul {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
    }

    .document-checklist li {
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .important-notes {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      border-radius: var(--radius-md);
      padding: 1rem;
      margin: 1rem 0;
    }

    .important-notes h5 {
      color: #856404;
      margin-bottom: 0.5rem;
    }

    .important-notes ul {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
    }

    .important-notes li {
      margin-bottom: 0.5rem;
      color: #856404;
      line-height: 1.4;
    }

    .offline-options {
      background: #e3f2fd;
      border: 1px solid #bbdefb;
      border-radius: var(--radius-md);
      padding: 1rem;
      margin: 1rem 0;
    }

    .offline-options h5 {
      color: #1565c0;
      margin-bottom: 0.5rem;
    }

    .offline-options ul {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
    }

    .offline-options li {
      margin-bottom: 0.5rem;
      color: #1565c0;
      line-height: 1.4;
    }

    .helpline-info p, .contact-info p {
      margin: 0.25rem 0;
      color: var(--text-secondary);
    }

    .helpline-info strong, .contact-info strong {
      color: var(--text-primary);
    }

    /* Portal Links Styles */
    .online-portals {
      margin: 1rem 0;
    }

    .online-portals h5 {
      color: var(--text-primary);
      margin: 1rem 0 0.5rem 0;
      font-size: 1rem;
    }

    .portal-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .portal-btn {
      background: linear-gradient(135deg, var(--light-blue) 0%, var(--dark-blue) 100%);
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .portal-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      background: linear-gradient(135deg, var(--dark-blue) 0%, var(--light-blue) 100%);
    }

    @media (max-width: 768px) {
      .portal-links {
        flex-direction: column;
      }
      
      .portal-btn {
        width: 100%;
        justify-content: center;
      }
    }

    /* Input Controls */
    .input-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .voice-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .voice-btn {
      background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-green) 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: var(--radius-xl);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .voice-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .voice-btn:hover::before {
      left: 100%;
    }

    .voice-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    .voice-btn:active {
      transform: translateY(0);
    }

    .voice-btn i {
      font-size: 1.25rem;
    }

    /* Multilingual Voice Controls */
    .multilingual-voice-controls {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin: 1rem 0;
    }

    .multilingual-voice-btn {
      background: var(--bg-accent);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.75rem 1.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .multilingual-voice-btn:hover {
      background: var(--primary-orange);
      color: white;
      transform: translateY(-1px);
    }

    .multilingual-voice-btn.voice-active {
      background: var(--success-green);
      color: white;
      border-color: var(--success-green);
    }

    .voice-language-selector, .voice-speed-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .voice-language-selector label, .voice-speed-selector label {
      font-weight: 600;
      color: var(--text-primary);
      min-width: 120px;
      font-size: 0.9rem;
    }

    .voice-language-selector select, .voice-speed-selector select {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .voice-language-selector select:focus, .voice-speed-selector select:focus {
      outline: none;
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.2);
    }

    /* Text Input Area */
    .text-input-section {
      display: grid;
      gap: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .text-input {
      flex: 1;
      padding: 1rem 1.5rem;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background: var(--bg-accent);
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .text-input:focus {
      outline: none;
      border-color: var(--light-blue);
      background: white;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .text-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--light-blue);
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
    }

    .send-btn:hover {
      background: var(--dark-blue);
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .send-btn:active {
      transform: translateY(0);
    }

    /* Language Selector */
    .language-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .language-label {
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .language-select {
      padding: 0.75rem 1rem;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      background: white;
      color: var(--text-primary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 150px;
    }

    .language-select:focus {
      outline: none;
      border-color: var(--light-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Sample Questions */
    .sample-questions {
      margin-top: 1.5rem;
      text-align: center;
    }

    .sample-questions h4 {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .question-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .question-btn {
      background: white;
      border: 2px solid var(--primary-green);
      color: var(--primary-green);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-lg);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .question-btn:hover {
      background: var(--primary-green);
      color: white;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* Utility Buttons */
    .utility-section {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .utility-btn {
      background: var(--light-blue);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .utility-btn:hover {
      background: var(--dark-blue);
      transform: translateY(-1px);
    }

    /* Advanced Search Styles */
    .advanced-search-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      border: 2px solid var(--border-light);
    }

    .search-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border-light);
    }

    .search-header h3 {
      color: var(--text-primary);
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
    }

    .toggle-search-btn {
      background: var(--light-blue);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .toggle-search-btn:hover {
      background: var(--dark-blue);
      transform: translateY(-1px);
    }

    .search-filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-label {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-select, .filter-input {
      padding: 0.75rem 1rem;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      background: white;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .filter-select:focus, .filter-input:focus {
      outline: none;
      border-color: var(--light-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .search-btn {
      background: linear-gradient(135deg, var(--primary-green) 0%, var(--light-blue) 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-md);
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .clear-btn {
      background: var(--warning-orange);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-lg);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: #d97706;
      transform: translateY(-1px);
    }

    .search-results-header {
      background: var(--bg-accent);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-lg);
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .results-count {
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sort-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .sort-label {
      font-weight: 500;
      color: var(--text-muted);
    }

    .sort-select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: white;
      font-size: 0.875rem;
    }

    .no-results {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
      background: var(--bg-accent);
      border-radius: var(--radius-lg);
      margin: 2rem 0;
    }

    .no-results i {
      font-size: 3rem;
      color: var(--warning-orange);
      margin-bottom: 1rem;
    }

    .no-results h3 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .search-suggestions {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-light);
    }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .suggestion-chip {
      background: var(--light-blue);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-chip:hover {
      background: var(--dark-blue);
      transform: translateY(-1px);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .header h2 {
        font-size: 1.25rem;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      .text-input {
        width: 100%;
      }
      
      .language-section {
        flex-direction: column;
        text-align: center;
      }
      
      .question-buttons {
        flex-direction: column;
        align-items: center;
      }
      
      .question-btn {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding: 1.5rem 0;
      }
      
      .header h1 {
        font-size: 1.75rem;
      }
      
      .header h2 {
        font-size: 1.1rem;
      }
      
      .chat-header {
        padding: 1rem;
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }
      
      #log {
        height: 400px;
        padding: 1rem;
      }
      
      .you, .bot {
        margin-left: 0;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Modern Header with YOJANA MITHRA Branding -->
  <header class="header">
    <div class="header-content">
      <h1 id="main-title">🏛️ YOJANA MITHRA</h1>
      <h2 id="main-subtitle">Your Government Scheme Assistant</h2>
      <div style="margin-top:1rem;">
        {% load static %}
        <a id="view-schemes-btn" href="{% url 'chatbot:schemes_all' %}" class="btn-primary" style="display:inline-block;max-width:260px;text-align:center;">View Available Schemes</a>
        <button onclick="document.getElementById('logoutForm').submit();" class="btn-secondary" style="display:inline-block;max-width:120px;text-align:center;margin-left:1rem;background:#dc2626;border:none;"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
    <form id="logoutForm" action="{% url 'chatbot:logout' %}" method="POST" style="display:none;">
      {% csrf_token %}
    </form>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Chat Interface -->
    <div class="chat-container">
      <div class="chat-header">
        <h3>
          <i class="fas fa-comments"></i>
          YOJANA MITHRA Assistant
        </h3>
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span id="connection-status">Online</span>
        </div>
      </div>
      <div id="log"></div>
    </div>

    <!-- Input Controls -->
    <div class="input-container">
      <!-- Voice Button -->
      <div class="voice-section">
        <button class="voice-btn" onclick="talk()">
          <i class="fas fa-microphone"></i>
          <span>CLICK & SPEAK</span>
        </button>
      </div>
      
      <!-- Advanced Search Container -->
      <div id="advanced-search-container" class="advanced-search-container" style="display: none;">
        <div class="search-header">
          <h3>
            <i class="fas fa-search-plus"></i>
            <span id="advanced-search-title">Advanced Search</span>
          </h3>
          <button onclick="toggleAdvancedSearch()" class="toggle-search-btn">
            <i class="fas fa-times"></i>
            <span id="close-search-text">Close</span>
          </button>
        </div>
        
        <div class="search-filters">
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-layer-group"></i>
              <span id="sector-filter-label">Sector</span>
            </label>
            <select id="sectorFilter" class="filter-select">
              <option value="">All Sectors</option>
              <option value="agriculture">🌾 Agriculture</option>
              <option value="health">🏥 Health</option>
              <option value="education">🎓 Education</option>
              <option value="employment">💼 Employment</option>
              <option value="housing">🏠 Housing</option>
              <option value="social_welfare">🤝 Social Welfare</option>
              <option value="rural_development">🏘️ Rural Development</option>
              <option value="urban_development">🏙️ Urban Development</option>
              <option value="women_empowerment">👩 Women Empowerment</option>
              <option value="youth_development">👨‍🎓 Youth Development</option>
              <option value="senior_citizens">👴 Senior Citizens</option>
              <option value="disability">♿ Disability</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-building"></i>
              <span id="ministry-filter-label">Ministry</span>
            </label>
            <input type="text" id="ministryFilter" class="filter-input" placeholder="Enter ministry name...">
          </div>
          
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-user-check"></i>
              <span id="eligibility-filter-label">Eligibility Keywords</span>
            </label>
            <input type="text" id="eligibilityFilter" class="filter-input" placeholder="e.g., farmer, woman, student...">
          </div>
          
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-sort"></i>
              <span id="sort-by-label">Sort By</span>
            </label>
            <select id="sortBy" class="filter-select">
              <option value="relevance">Relevance</option>
              <option value="alphabetical">Alphabetical</option>
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
        
        <div class="search-actions">
          <button onclick="performAdvancedSearch()" class="search-btn">
            <i class="fas fa-search"></i>
            <span id="search-btn-text">Search Schemes</span>
          </button>
          <button onclick="clearAdvancedFilters()" class="clear-btn">
            <i class="fas fa-eraser"></i>
            <span id="clear-filters-text">Clear Filters</span>
          </button>
        </div>
      </div>

      <!-- Text Input will be added by JavaScript -->
      <div id="text-input-area"></div>
    </div>
  </div>

  // Simple log function - NO voice logic here
  function log(msg, cls = '') {
      const p = document.createElement('p');
      p.innerHTML = msg;
      if (cls) p.className = cls;
      document.getElementById('log').appendChild(p);
      // Auto-scroll to bottom
      document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
  }

  function displaySchemes(schemes) {
      if (schemes && schemes.length > 0) {
          const t = uiTranslations[currentUILanguage];
          let schemesHtml = `
              <div class="schemes-container">
                  <h3>
                      <i class="fas fa-file-alt"></i>
                      ${t.relatedSchemes} (${schemes.length})
                  </h3>
          `;
          
          schemes.forEach((scheme, index) => {
              // Get sector icon
              const sectorIcon = getSectorIcon(scheme.sector);
              
              schemesHtml += `
                  <div class="scheme-card">
                      <h4>
                          ${sectorIcon}
                          ${scheme.title}
                      </h4>
                      <p><strong><i class="fas fa-tag"></i> ${t.sector}:</strong> ${scheme.sector.charAt(0).toUpperCase() + scheme.sector.slice(1).replace('_', ' ')}</p>
                      <p><strong><i class="fas fa-info-circle"></i> ${t.description}:</strong> ${scheme.short_description}</p>
                      ${scheme.ministry ? `<p><strong><i class="fas fa-building"></i> ${t.ministry}:</strong> ${scheme.ministry}</p>` : ''}
                      ${scheme.eligibility_criteria ? `<p><strong><i class="fas fa-user-check"></i> ${t.eligibility}:</strong> ${scheme.eligibility_criteria.substring(0, 200)}...</p>` : ''}
                      ${scheme.benefits ? `<p><strong><i class="fas fa-gift"></i> ${t.benefits}:</strong> ${scheme.benefits.substring(0, 150)}...</p>` : ''}
                      
                      <div class="scheme-actions">
                          <button class="apply-btn" onclick="applyForScheme('${scheme.title}', '${scheme.source_url || scheme.website || '#'}', '${scheme.sector || ''}')">
                              <i class="fas fa-paper-plane"></i>
                              ${t.applyNow || 'Apply Now'}
                          </button>
                          <button class="info-btn" onclick="showSchemeDetails('${scheme.title}')">
                              <i class="fas fa-info-circle"></i>
                              ${t.moreInfo || 'More Info'}
                          </button>
                      </div>
                  </div>
              `;
          });
          
          schemesHtml += '</div>';
          log(schemesHtml, 'schemes');
      }
  }

  function getSectorIcon(sector) {
      const icons = {
          'agriculture': '🌾',
          'health': '🏥',
          'education': '🎓',
          'employment': '💼',
          'housing': '🏠',
          'social_welfare': '🤝',
          'rural_development': '🏘️',
          'urban_development': '🏙️',
          'women_empowerment': '👩',
          'youth_development': '👨‍🎓',
          'senior_citizens': '👴',
          'disability': '♿'
      };
      return icons[sector] || '📋';
  }

  async function sendTextQuery(query) {
      if (!query.trim()) return;
      
      const t = uiTranslations[currentUILanguage];
      log(`<span class="you">You:</span> ${query}`, 'you');
      log(t.processing, 'bot');
      
      try {
          const response = await fetch('/api/chat/text/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  query: query,
                  lang: document.getElementById('languageSelect').value
              })
          });
          
          const data = await response.json();
          
          if (data.success) {
              const botResponse = data.response;
              log(`<span class="bot">Bot:</span> ${botResponse}`, 'bot');
              displaySchemes(data.schemes);
              
              // Play voice for bot response
              const cleanText = botResponse.replace(/<[^>]*>/g, '').trim();
              if (cleanText) {
                  setTimeout(() => playBotVoice(cleanText, currentVoiceLanguage), 400);
              }
              
              if (data.confidence < 0.5) {
                  log('<em>Note: I\'m not very confident about this answer. Please try rephrasing your question.</em>', 'bot');
              }
          } else {
              log(`<span class="bot">Error:</span> ${data.error || 'Failed to process your query'}`, 'bot');
          }
      } catch (error) {
          console.error('Text query error:', error);
          
          if (error.name === 'TypeError' || error.message.includes('fetch')) {
              log(`<span class="bot">🌐 Network Error:</span> Connection failed. Please check your internet connection.`, 'bot');
              log('<span class="bot">💡 Troubleshooting:</span>', 'bot');
              log('• Check if you\'re connected to the internet', 'bot');
              log('• Try refreshing the page', 'bot');
              log('• Check if the server is running (python manage.py runserver)', 'bot');
          } else {
              log(`<span class="bot">❌ Error:</span> ${error.message || 'Something went wrong. Please try again.'}`, 'bot');
          }
          
          showRetryOptions();
      }
  }

  async function talk() {
      // Check internet connectivity first
      if (!navigator.onLine) {
          log('<span class="bot">🌐 No internet connection detected.</span>', 'bot');
          log('<span class="bot">Switching to offline voice processing...</span>', 'bot');
          useOfflineVoiceRecording();
          return;
      }

  // CLEAN VOICE SYSTEM - Single implementation
  let currentVoiceLanguage = 'en';
  let isPlayingVoice = false;

  // Play voice for bot response - ONLY function that triggers voice
  async function playBotVoice(text, language = 'en') {
      // Prevent overlapping voices
      if (isPlayingVoice || !text || !text.trim()) return;
      
      isPlayingVoice = true;
      
      try {
          const response = await fetch('/multilingual-voice/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  text: text.trim(),
                  language: language
              })
          });
          
          const data = await response.json();
          
          if (data.success && data.audio_data) {
              const audio = new Audio('data:audio/mp3;base64,' + data.audio_data);
              
              audio.onended = () => { isPlayingVoice = false; };
              audio.onerror = () => { isPlayingVoice = false; };
              
              await audio.play();
          } else {
              isPlayingVoice = false;
          }
      } catch (error) {
          console.error('Voice error:', error);
          isPlayingVoice = false;
      }
  }

  function useWebSpeechAPI() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      
      // Optimized settings for faster recognition
      recognition.continuous = false;
      recognition.interimResults = true;  // Show interim results
      recognition.maxAlternatives = 1;
      recognition.lang = getLanguageCode(currentLanguage);
      
      // Immediate feedback - don't wait for onstart
      log('🎤 Initializing microphone... Speak after the beep!', 'bot');
      
      let finalTranscript = '';
      let interimTranscript = '';
      let hasStarted = false;
      
      recognition.onstart = function() {
          hasStarted = true;
          console.log('Speech recognition started');
          log('🔴 Recording now - SPEAK!', 'bot');
      };
      
      recognition.onresult = function(event) {
          interimTranscript = '';
          finalTranscript = '';
          
          for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                  finalTranscript += transcript;
              } else {
                  interimTranscript += transcript;
              }
          }
          
          // Show interim results to user for immediate feedback
          if (interimTranscript) {
              log(`<span class="you">Hearing:</span> <em>${interimTranscript}</em>`, 'you');
          }
          
          // Process final result
          if (finalTranscript) {
              const confidence = event.results[event.results.length - 1][0].confidence;
              log(`<span class="you">You said:</span> ${finalTranscript}`, 'you');
              
              // Send the recognized text to chat API immediately
              sendTextQuery(finalTranscript);
              
              // 🔧 FIX: Auto-reinitialize voice recorder for continuous conversation
              // User doesn't need to click again for next voice input
              setTimeout(() => {
                  log('🎤 Ready for next voice input... Click "CLICK & SPEAK" or just start speaking!', 'bot');
                  // Recognition object is ready to be reused when user clicks voice button again
              }, 1000);
          }
      };
      
      recognition.onerror = function(event) {
          console.log('Speech recognition error:', event.error);
          
          if (event.error === 'no-speech') {
              log('<span class="bot">❌ No speech detected.</span>', 'bot');
              log('<span class="bot">🔧 Troubleshooting:</span>', 'bot');
              log('• <strong>Check microphone:</strong> Ensure it\'s connected and working', 'bot');
              log('• <strong>Speak clearly:</strong> Try speaking louder and closer to the microphone', 'bot');
              log('• <strong>Permissions:</strong> Make sure you allowed microphone access', 'bot');
              log('• <strong>Browser:</strong> Try refreshing the page and allow microphone again', 'bot');
              showRetryOptions();
          } else if (event.error === 'not-allowed') {
              log('<span class="bot">❌ Microphone access denied.</span>', 'bot');
              log('<span class="bot">🔧 To fix microphone permissions:</span>', 'bot');
              log('• <strong>Step 1:</strong> Click the 🔒 or 🎤 icon in your browser address bar', 'bot');
              log('• <strong>Step 2:</strong> Select "Always allow" for microphone access', 'bot');
              log('• <strong>Step 3:</strong> Refresh the page and try again', 'bot');
              log('• <strong>Alternative:</strong> Use Chrome or Edge for better compatibility', 'bot');
              showRetryOptions();
          } else if (event.error === 'network') {
              log('<span class="bot">❌ Network error detected.</span>', 'bot');
              log('<span class="bot">🌐 Switching to offline mode...</span>', 'bot');
              setTimeout(() => {
                  useOfflineVoiceRecording();
              }, 1000);
          } else if (event.error === 'audio-capture') {
              log('<span class="bot">❌ Audio capture error.</span>', 'bot');
              log('• <strong>Close other apps:</strong> Check if another application is using your microphone', 'bot');
              log('• <strong>Restart browser:</strong> Close and reopen your browser', 'bot');
              log('• <strong>Check settings:</strong> Ensure microphone is not muted in system settings', 'bot');
              showRetryOptions();
          } else if (event.error === 'service-not-allowed') {
              log('<span class="bot">❌ Speech service not allowed.</span>', 'bot');
              log('<span class="bot">🔄 Switching to offline voice processing...</span>', 'bot');
              setTimeout(() => {
                  useOfflineVoiceRecording();
              }, 1000);
          } else {
              log(`<span class="bot">❌ Speech Recognition Error:</span> ${event.error}`, 'bot');
              log('<span class="bot">🔄 Trying offline voice processing...</span>', 'bot');
              setTimeout(() => {
                  useOfflineVoiceRecording();
              }, 1000);
          }
      };
      
      recognition.onend = function() {
          log('🎤 Listening stopped', 'bot');
          if (!finalTranscript && !interimTranscript) {
              log('<span class="bot">💡 Try again:</span> Click "CLICK & SPEAK" and speak immediately after you see "Recording started"', 'bot');
          }
      };
      
      try {
          recognition.start();
      } catch (error) {
          log(`<span class="bot">❌ Failed to start speech recognition:</span> ${error.message}`, 'bot');
          log('<span class="bot">💡 Please use the text input below instead.</span>', 'bot');
      }
  }

  // Offline voice recording function (uses server-side Whisper)
  async function useOfflineVoiceRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          log('<span class="bot">❌ Microphone access not available.</span>', 'bot');
          log('<span class="bot">Please use text input instead.</span>', 'bot');
          return;
      }

      try {
          log('🎤 Starting offline voice recording...', 'bot');
          log('<em>💡 This works without internet using server-side processing</em>', 'bot');
          
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          const audioChunks = [];
          
          mediaRecorder.ondataavailable = event => {
              audioChunks.push(event.data);
          };
          
          mediaRecorder.onstop = async () => {
              log('🔄 Processing audio offline...', 'bot');
              const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
              await sendOfflineVoiceQuery(audioBlob);
              stream.getTracks().forEach(track => track.stop());
          };
          
          log('🔴 Recording... Speak now! (Will auto-stop in 10 seconds)', 'bot');
          mediaRecorder.start();
          
          // Auto-stop after 10 seconds
          setTimeout(() => {
              if (mediaRecorder.state === 'recording') {
                  mediaRecorder.stop();
                  log('⏹️ Recording stopped', 'bot');
              }
          }, 10000);
          
      } catch (error) {
          log(`<span class="bot">❌ Could not access microphone:</span> ${error.message}`, 'bot');
          
          if (error.name === 'NotAllowedError') {
              log('<span class="bot">🔧 Microphone access denied. Please:</span>', 'bot');
              log('• Allow microphone access in your browser', 'bot');
              log('• Refresh the page and try again', 'bot');
          } else if (error.name === 'NotFoundError') {
              log('<span class="bot">🔧 No microphone found. Please:</span>', 'bot');
              log('• Connect a microphone to your device', 'bot');
              log('• Check if your microphone is working', 'bot');
          }
          
          showRetryOptions();
      }
  }

  async function sendOfflineVoiceQuery(audioBlob) {
      try {
          const formData = new FormData();
          formData.append('audio', audioBlob, 'voice.wav');
          formData.append('lang', document.getElementById('languageSelect').value);
          
          const response = await fetch('/voice/', {
              method: 'POST',
              body: formData
          });
          
          const data = await response.json();
          
          if (data.success) {
              if (data.user_text) {
                  log(`<span class="you">You said:</span> ${data.user_text}`, 'you');
              }
              const botResponse = data.text_response;
              log(`<span class="bot">Bot:</span> ${botResponse}`, 'bot');
              displaySchemes(data.schemes);
              
              // Play voice for bot response
              const cleanText = botResponse.replace(/<[^>]*>/g, '').trim();
              if (cleanText) {
                  setTimeout(() => playBotVoice(cleanText, currentVoiceLanguage), 400);
              }
              
              if (data.confidence < 0.5) {
                  log('<em>Note: Low confidence response. Please try rephrasing.</em>', 'bot');
              }
          } else {
              log(`<span class="bot">❌ Offline voice processing failed:</span> ${data.error}`, 'bot');
              log('<span class="bot">🔧 This might be because:</span>', 'bot');
              log('• The audio was too quiet or unclear', 'bot');
              log('• The server-side voice processing is not available', 'bot');
              showRetryOptions();
          }
      } catch (error) {
          log(`<span class="bot">❌ Error processing offline voice:</span> ${error.message}`, 'bot');
          
          if (error.message.includes('fetch') || error.name === 'TypeError') {
              log('<span class="bot">🌐 Server connection failed. Please:</span>', 'bot');
              log('• Check if the server is running', 'bot');
              log('• Verify your internet connection', 'bot');
              log('• Try refreshing the page', 'bot');
          }
          
          showRetryOptions();
      }
  }

  async function translatePageContent(targetLang) {
      if (targetLang === 'en') {
          return; // No translation needed for English
      }
      
      try {
          // Translate all translatable elements
          const translatableElements = document.querySelectorAll('[data-translatable]');
          
          for (const element of translatableElements) {
              const originalText = element.getAttribute('data-original-text') || element.textContent;
              
              // Store original if not already stored
              if (!element.getAttribute('data-original-text')) {
                  element.setAttribute('data-original-text', originalText);
              }
              
              // Skip if already in target language
              if (element.getAttribute('data-current-lang') === targetLang) {
                  continue;
              }
              
              // Translate via API
              const translated = await translateText(originalText, targetLang, 'text');
              if (translated) {
                  element.textContent = translated;
                  element.setAttribute('data-current-lang', targetLang);
              }
          }
          
          // Translate scheme cards if on schemes page
          await translateSchemeCards(targetLang);
          
      } catch (error) {
          console.error('Page translation error:', error);
      }
  }
  
  async function translateText(text, targetLang, type = 'text') {
      try {
          const response = await fetch('/api/translate/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  content: text,
                  language: targetLang,
                  type: type
              })
          });
          
          const data = await response.json();
          if (data.success) {
              return data.translated;
          }
          return null;
      } catch (error) {
          console.error('Translation API error:', error);
          return null;
      }
  }
  
  async function translateSchemeCards(targetLang) {
      // Find all scheme cards on the page
      const schemeCards = document.querySelectorAll('.scheme-card, .card[data-scheme-id]');
      
      if (schemeCards.length === 0) {
          return;
      }
      
      // Collect scheme IDs
      const schemeIds = Array.from(schemeCards).map(card => {
          return card.getAttribute('data-scheme-id');
      }).filter(id => id);
      
      if (schemeIds.length === 0) {
          return;
      }
      
      try {
          // Batch translate schemes
          const response = await fetch('/api/translate/schemes/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  scheme_ids: schemeIds,
                  language: targetLang
              })
          });
          
          const data = await response.json();
          if (data.success && data.translations) {
              // Apply translations to cards
              schemeCards.forEach(card => {
                  const schemeId = card.getAttribute('data-scheme-id');
                  const translation = data.translations[schemeId];
                  
                  if (translation) {
                      // Update card content with translated data
                      const titleElement = card.querySelector('.scheme-title, h3, h4');
                      const descElement = card.querySelector('.scheme-description, .description, p');
                      const sectorElement = card.querySelector('.scheme-sector, .sector');
                      const ministryElement = card.querySelector('.scheme-ministry, .ministry');
                      
                      if (titleElement && translation.title) {
                          titleElement.textContent = translation.title;
                      }
                      if (descElement && translation.short_description) {
                          descElement.textContent = translation.short_description;
                      }
                      if (sectorElement && translation.sector) {
                          sectorElement.textContent = translation.sector;
                      }
                      if (ministryElement && translation.ministry) {
                          ministryElement.textContent = translation.ministry;
                      }
                  }
              });
          }
      } catch (error) {
          console.error('Scheme translation error:', error);
      }
  }

  async function performAdvancedSearch() {
      const t = uiTranslations[currentUILanguage];
      const sector = document.getElementById('sectorFilter').value;
      const ministry = document.getElementById('ministryFilter').value.trim();
      const eligibility = document.getElementById('eligibilityFilter').value.trim();
      const sortBy = document.getElementById('sortBy').value;
      
      // Build search query
      let searchQuery = 'Show me government schemes';
      if (sector) {
          const sectorName = document.getElementById('sectorFilter').selectedOptions[0].textContent.replace(/🌾|🏥|🎓|💼|🏠|🤝|🏘️|🏙️|👩|👨‍🎓|👴|♿/g, '').trim();
          searchQuery += ` in ${sectorName}`;
      }
      if (ministry) {
          searchQuery += ` from ${ministry} ministry`;
      }
      if (eligibility) {
          searchQuery += ` for ${eligibility}`;
      }
      
      log(`<span class="you">Advanced Search:</span> ${searchQuery}`, 'you');
      log(t.processing, 'bot');
      
      try {
          const response = await fetch('/api/chat/advanced-search/', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken')
              },
              body: JSON.stringify({
                  sector: sector,
                  ministry: ministry,
                  eligibility: eligibility,
                  sortBy: sortBy,
                  language: currentLanguage
              })
          });
          
          if (response.ok) {
              const data = await response.json();
              
              // Remove processing message
              const logElement = document.getElementById('log');
              if (logElement.lastElementChild && logElement.lastElementChild.textContent.includes(t.processing)) {
                  logElement.removeChild(logElement.lastElementChild);
              }
              
              if (data.schemes && data.schemes.length > 0) {
                  // Show results header
                  showSearchResultsHeader(data.schemes.length, sortBy);
                  
                  // Sort schemes based on selection
                  const sortedSchemes = sortSchemes(data.schemes, sortBy);
                  
                  // Display schemes
                  displaySchemes(sortedSchemes);
                  
                    log(`<span class="bot">Bot:</span> ${data.response}`, 'bot');

                    // Auto-play returned audio (base64) if provided by the server
                    if (data.audio_response) {
                      try {
                        const audioFormat = data.audio_format || 'mp3';
                        const audioSrc = `data:audio/${audioFormat};base64,${data.audio_response}`;
                        const audio = new Audio(audioSrc);
                        audio.play().catch(err => {
                          console.warn('Audio autoplay blocked or failed:', err);
                          // Provide a manual play button in the bot log so user can play audio
                          const playBtnHtml = `<button class="audio-play-btn" onclick="(function(){let a=document.getElementById('search-result-audio'); if(!a){a=new Audio('${audioSrc}'); a.id='search-result-audio'; document.body.appendChild(a);} document.getElementById('search-result-audio').play();})()">▶ Play audio</button>`;
                          log(playBtnHtml, 'bot');
                        });
                      } catch (e) {
                        console.error('Error while attempting to play audio:', e);
                      }
                    }
              } else {
                  showNoResults();
              }
          } else {
              log(`<span class="bot">Error:</span> Failed to perform advanced search. Please try again.`, 'bot');
          }
      } catch (error) {
          console.error('Advanced search error:', error);
          log(`<span class="bot">Error:</span> Network error. Please check your connection.`, 'bot');
      }
  }

  function showSearchResultsHeader(count, sortBy) {

  function getSortText(sortBy) {
      const t = uiTranslations[currentUILanguage];
      const sortTexts = {
          'relevance': t.sortRelevance,
          'alphabetical': t.sortAlphabetical,
          'newest': t.sortNewest,
          'oldest': t.sortOldest
      };
      return sortTexts[sortBy] || t.sortRelevance;
  }

  function sortSchemes(schemes, sortBy) {
      const sortedSchemes = [...schemes];
      
      switch (sortBy) {
          case 'alphabetical':
              return sortedSchemes.sort((a, b) => a.title.localeCompare(b.title));
          case 'newest':
              return sortedSchemes.sort((a, b) => new Date(b.created_date || 0) - new Date(a.created_date || 0));
          case 'oldest':
              return sortedSchemes.sort((a, b) => new Date(a.created_date || 0) - new Date(b.created_date || 0));
          case 'relevance':
          default:
              return sortedSchemes; // Keep original relevance order
      }
  }

                      🗄️ Test Database
                  </button>
              </div>
          </div>
      `;
      log(retryHtml, 'retry-options');
  }

  // Test microphone functionality
  async function testMicrophone() {
      log('<span class="bot">🔧 Testing microphone...</span>', 'bot');
      
      try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          log('<span class="bot">✅ Microphone access granted!</span>', 'bot');
          log('<span class="bot">🎤 Microphone is working. You can now try voice input again.</span>', 'bot');
          
          // Stop the stream
          stream.getTracks().forEach(track => track.stop());
          
          // Show available audio devices
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(device => device.kind === 'audioinput');
          
          if (audioInputs.length > 0) {
              log(`<span class="bot">🎧 Found ${audioInputs.length} audio input device(s):</span>`, 'bot');
              audioInputs.forEach((device, index) => {
                  const deviceName = device.label || `Microphone ${index + 1}`;
                  log(`• ${deviceName}`, 'bot');
              });
          }
          
      } catch (error) {
          log('<span class="bot">❌ Microphone test failed:</span>', 'bot');
          
          if (error.name === 'NotAllowedError') {
              log('• Microphone access was denied', 'bot');
              log('• Please allow microphone access and try again', 'bot');
          } else if (error.name === 'NotFoundError') {
              log('• No microphone found', 'bot');
              log('• Please connect a microphone and try again', 'bot');
          } else {
              log(`• Error: ${error.message}`, 'bot');
          }
      }
  }

  // Test database connectivity and data availability
  async function testDatabase() {
      log('<span class="bot">🗄️ Testing database connection...</span>', 'bot');
      
      try {
          const response = await fetch('/api/database/status/', {
              method: 'GET',
              headers: {
                  'Content-Type': 'application/json',
              }
          });
          
          const data = await response.json();
          
          if (data.success && data.mongodb_connected) {
              log('<span class="bot">✅ Database connection successful!</span>', 'bot');
              log(`<span class="bot">📊 Found ${data.total_schemes} schemes in database</span>`, 'bot');
              log(`<span class="bot">🗄️ Database: ${data.database_name}</span>`, 'bot');
              log(`<span class="bot">📁 Collection: ${data.collection_name}</span>`, 'bot');
              
              if (data.total_schemes === 0) {
                  log('<span class="bot">⚠️ No schemes found in database!</span>', 'bot');
                  log('<span class="bot">💡 You need to add scheme data using MongoDB commands:</span>', 'bot');
                  log('• Use the commands in mongodb_insert_commands.js', 'bot');
                  log('• Copy and paste them in MongoDB Compass', 'bot');
              } else {
                  log('<span class="bot">🎉 Database is ready! You can now search for schemes.</span>', 'bot');
              }
          } else {
              log('<span class="bot">❌ Database connection failed!</span>', 'bot');
              log(`<span class="bot">Error: ${data.error}</span>`, 'bot');
              log('<span class="bot">🔧 Troubleshooting:</span>', 'bot');
              log('• Make sure MongoDB is running', 'bot');
              log('• Check if mongodb_adapter.py exists', 'bot');
              log('• Verify MongoDB connection settings', 'bot');
          }
          
      } catch (error) {
          log('<span class="bot">❌ Database test failed!</span>', 'bot');
          log(`<span class="bot">Error: ${error.message}</span>`, 'bot');
          log('<span class="bot">🔧 This might be because:</span>', 'bot');
          log('• The server is not running', 'bot');
          log('• MongoDB is not installed or running', 'bot');
          log('• Network connection issues', 'bot');
      }
  }

  // CSRF token helper
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
              }
          }
      }
      return cookieValue;
  }
