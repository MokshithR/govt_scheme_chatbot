{% extends "admin/login.html" %}
{% load i18n %}

{% block content %}
  <h1>{{ title }}</h1>
  {% if form.errors %}
    <p class="errornote">{% trans "Please correct the error below." %}</p>
  {% endif %}

  <form action="{% url 'admin:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" method="post" id="login-form">
    {% csrf_token %}

    <div class="form-row">
      <label for="id_username">{% trans "Username:" %}</label>
      <input type="text" name="username" id="id_username" autofocus maxlength="150" required>
    </div>

    <div class="form-row">
      <label for="id_password">{% trans "Password:" %}</label>
      <input type="password" name="password" id="id_password" required>
    </div>

    <input type="hidden" name="next" value="{{ next }}">

    <div class="submit-row">
      <input type="submit" value="{% trans 'Log in' %}">
    </div>
  </form>
{% endblock %}
